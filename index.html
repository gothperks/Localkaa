<!DOCTYPE html>
<html>
  <head>
    <title>λokalka</title>
    <link href="css/main.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Nunito"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Play"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap"
    />
    <meta content="λokalka" property="og:title" />
    <meta content="#000000" data-react-helmet="true" name="theme-color" />
    <style>
      body {
        background-color: #000;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: 'Orbitron', sans-serif;
        color: #fff;
      }
      
      .centered-gif {
        width: 300px;
        height: 300px;
        background-image: url('content/bg.mp4');
        background-repeat: no-repeat;
        background-position: center center;
        background-size: contain;
        border-radius: 10px;
      }
      
      .content {
        text-align: center;
        align-items: center;
        width: 99.5svw;
        position: absolute;
        left: 0;
        top: 0;
        font-family: 'Orbitron', sans-serif;
      }
      
      .zhead, .zteam {
        font-family: 'Orbitron', sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="centered-video">
      <video autoplay muted loop playsinline>
        <source src="content/bg.mp4" type="video/mp4">
      </video>
    </div>

    <div class="content">
      <div class="zhead"></div>
      <div style="height: 95svh"></div>

      <div class="zteam"></div>
      <script src="js/script.js"></script>
    </div>
  </body>
</html>
